<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
    <style>
      .t{fill:#1f2937}.s{fill:#4b5563;font-size:11.5px}.h{font-weight:600}
      .e{fill:#e8f0fb;stroke:#4a78b5}.p{fill:#f6f2fb;stroke:#8a63c2}.j{fill:#eef6ee;stroke:#4c9a52}.d{fill:#f3f4f6;stroke:#6b7280}
      .ln{stroke:#44546a;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect x="5" y="5" width="890" height="350" rx="10" fill="#fff" stroke="#d1d5db"/>
  <text x="24" y="32" class="t h" font-size="15">Outbound policy levels – precedence (left wins for attributes, right is overwritten for headers)</text>

  <text x="24" y="70" class="t h">Case A – the endpoint declares the profile</text>
  <rect x="24" y="84" width="150" height="54" rx="6" class="e"/><text x="99" y="108" text-anchor="middle" class="t h">endpoint</text><text x="99" y="125" text-anchor="middle" class="s">endpoints/item</text>
  <rect x="204" y="84" width="150" height="54" rx="6" class="p"/><text x="279" y="108" text-anchor="middle" class="t h">profile</text><text x="279" y="125" text-anchor="middle" class="s">of the endpoint</text>
  <rect x="384" y="84" width="150" height="54" rx="6" class="j"/><text x="459" y="108" text-anchor="middle" class="t h">project</text><text x="459" y="125" text-anchor="middle" class="s">projects/item</text>
  <rect x="564" y="84" width="150" height="54" rx="6" class="d"/><text x="639" y="108" text-anchor="middle" class="t h">defaults</text><text x="639" y="125" text-anchor="middle" class="s">all attributes required</text>
  <g class="ln"><path d="M174 111 H202" marker-end="url(#a)"/><path d="M354 111 H382" marker-end="url(#a)"/><path d="M534 111 H562" marker-end="url(#a)"/></g>
  <text x="740" y="106" class="s">the project's profile</text>
  <text x="740" y="121" class="s">is ignored</text>

  <text x="24" y="182" class="t h">Case B – only the project declares the profile</text>
  <rect x="24" y="196" width="150" height="54" rx="6" class="e"/><text x="99" y="220" text-anchor="middle" class="t h">endpoint</text><text x="99" y="237" text-anchor="middle" class="s">(no profile)</text>
  <rect x="204" y="196" width="150" height="54" rx="6" class="j"/><text x="279" y="220" text-anchor="middle" class="t h">project</text><text x="279" y="237" text-anchor="middle" class="s">projects/item</text>
  <rect x="384" y="196" width="150" height="54" rx="6" class="p"/><text x="459" y="220" text-anchor="middle" class="t h">profile</text><text x="459" y="237" text-anchor="middle" class="s">of the project</text>
  <rect x="564" y="196" width="150" height="54" rx="6" class="d"/><text x="639" y="220" text-anchor="middle" class="t h">defaults</text><text x="639" y="237" text-anchor="middle" class="s">all attributes required</text>
  <g class="ln"><path d="M174 223 H202" marker-end="url(#a)"/><path d="M354 223 H382" marker-end="url(#a)"/><path d="M534 223 H562" marker-end="url(#a)"/></g>

  <text x="24" y="292" class="s">Attributes: the levels are scanned left to right and the first level that defines the attribute wins.</text>
  <text x="24" y="310" class="s">Headers: the levels are scanned right to left; a header defined again on a more specific level overwrites the previous value.</text>
  <text x="24" y="328" class="s">Endpoint = business service local name (osb.service.name); project = OSB project of the business service (osb.project). Missing levels are skipped.</text>
</svg>

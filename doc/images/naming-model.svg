<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
    <style>
      .t{fill:#1f2937}.s{fill:#4b5563;font-size:11.5px}.m{font-family:Consolas,monospace;font-size:11.5px;fill:#1f2937}.h{font-weight:600}
      .c{fill:#f6f2fb;stroke:#8a63c2}.ln{stroke:#44546a;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect x="5" y="5" width="890" height="390" rx="10" fill="#fff" stroke="#d1d5db"/>
  <text x="24" y="32" class="t h" font-size="15">Logical names and where they are resolved</text>

  <rect x="262" y="52" width="376" height="104" rx="8" class="c"/>
  <text x="450" y="74" text-anchor="middle" class="t h">ResourceMappings.xml</text>
  <text x="278" y="96" class="m">&lt;provider name="&lt;provider&gt;"&gt;</text>
  <text x="288" y="112" class="m">&lt;item name="&lt;identity&gt;" value="&lt;client_id&gt;"/&gt;</text>
  <text x="288" y="128" class="m">&lt;item name="&lt;resource&gt;" value="&lt;resource id&gt;"/&gt;</text>
  <text x="288" y="144" class="m">&lt;item name="&lt;audience&gt;" value="&lt;aud value&gt;"/&gt;</text>

  <rect x="24" y="200" width="260" height="96" rx="8" class="c"/>
  <text x="154" y="222" text-anchor="middle" class="t h">OutboundPolicies.xml</text>
  <text x="36" y="244" class="m">identity="&lt;identity&gt;"</text>
  <text x="36" y="262" class="m">resource="&lt;resource&gt;"</text>
  <text x="36" y="282" class="s">name → client_id / resource id</text>

  <rect x="320" y="200" width="260" height="96" rx="8" class="c"/>
  <text x="450" y="222" text-anchor="middle" class="t h">ClientSecrets.sa / ClientKeys.xml</text>
  <text x="332" y="244" class="m">remote user "&lt;provider&gt;:&lt;identity&gt;"</text>
  <text x="332" y="262" class="m">item provider=… identity=…</text>
  <text x="332" y="282" class="s">provider + identity → secret / key</text>

  <rect x="616" y="200" width="260" height="96" rx="8" class="c"/>
  <text x="746" y="222" text-anchor="middle" class="t h">InboundPolicies.xml</text>
  <text x="628" y="244" class="m">item identity="&lt;identity&gt;"</text>
  <text x="628" y="262" class="m">     username="&lt;realm user&gt;"</text>
  <text x="628" y="282" class="s">token client_id → identity → realm user</text>

  <g class="ln">
    <path d="M154 200 C 154 170, 220 150, 260 120" marker-end="url(#a)"/>
    <path d="M746 200 C 746 170, 680 150, 640 120" marker-end="url(#a)"/>
    <path d="M450 200 V160" marker-end="url(#a)" stroke-dasharray="4 3"/>
  </g>
  <text x="44" y="176" class="s">translateResource</text>
  <text x="640" y="170" class="s">reverseTranslateResource</text>
  <text x="458" y="186" class="s">same logical name</text>

  <text x="24" y="330" class="s">Provider and logical names are free text chosen by the administrator (any naming convention, e.g. prefixes, is optional).</text>
  <text x="24" y="348" class="s">Names are unique in the whole file, values are unique inside each provider (both enforced by the XSD).</text>
  <text x="24" y="366" class="s">Only secrets live in service accounts; everything that is not a secret is readable in clear in ResourceMappings.xml.</text>
</svg>
